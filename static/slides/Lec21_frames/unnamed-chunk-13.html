<!DOCTYPE html>
<html lang="en">
<head>

<style>body{background-color:white;}</style>

<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
<link href="lib/bootstrap-5.3.8/bootstrap.min.css" rel="stylesheet" />
<script src="lib/bootstrap-5.3.8/bootstrap.bundle.min.js"></script>
<script src="lib/bs3compat-0.12.0/transition.js"></script>
<script src="lib/bs3compat-0.12.0/tabs.js"></script>
<script src="lib/bs3compat-0.12.0/bs3compat.js"></script>

<body>
  <div class="bslib-grid bslib-mb-spacing html-fill-item" data-require-bs-caller="layout_column_wrap()" data-require-bs-version="5" style="grid-template-columns:repeat(3, minmax(0, 1fr));grid-auto-rows:1fr;--bslib-grid-height:auto;--bslib-grid-height-mobile:auto;">
    <div class="bslib-grid-item bslib-gap-spacing html-fill-container">

        <div class="card-header bslib-gap-spacing">Card 1</div>
        <div class="card-body bslib-gap-spacing html-fill-item html-fill-container" style="margin-top:auto;margin-bottom:auto;flex:1 1 auto;">Content 1</div>
        <script data-bslib-card-init>bslib.Card.initializeAllCards();</script>
      </div>
    </div>
    <div class="bslib-grid-item bslib-gap-spacing html-fill-container">
      <div class="card bslib-card bslib-mb-spacing html-fill-item html-fill-container" data-bslib-card-init data-require-bs-caller="card()" data-require-bs-version="5">
        <div class="card-header bslib-gap-spacing">Card 2</div>
        <div class="card-body bslib-gap-spacing html-fill-item html-fill-container" style="margin-top:auto;margin-bottom:auto;flex:1 1 auto;">Content 2</div>
        <script data-bslib-card-init>bslib.Card.initializeAllCards();</script>
      </div>
    </div>
    <div class="bslib-grid-item bslib-gap-spacing html-fill-container">
      <div class="card bslib-card bslib-mb-spacing html-fill-item html-fill-container" data-bslib-card-init data-require-bs-caller="card()" data-require-bs-version="5">
        <div class="card-header bslib-gap-spacing">Card 3</div>
        <div class="card-body bslib-gap-spacing html-fill-item html-fill-container" style="margin-top:auto;margin-bottom:auto;flex:1 1 auto;">Content 3</div>
        <script data-bslib-card-init>bslib.Card.initializeAllCards();</script>
      </div>
    </div>
  </div>
</body>
</html>
