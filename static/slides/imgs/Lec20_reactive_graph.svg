<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 415" role="img" aria-labelledby="title desc">
<title id="title">The reactive graph</title>
<desc id="desc">Inputs a, b, x, and n feed reactive d, which feeds the plot and table. Inputs bw and facet also feed the plot. Input n feeds an observer that updates the x slider, shown by a dashed arrow back to input x.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#606b73"/></marker>
  <marker id="update-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8e44ad"/></marker>
</defs>
<g fill="none" stroke="#606b73" stroke-width="2" marker-end="url(#arrow)">
  <path d="M 310 90 C 365 90, 375 175, 430 175"/>
  <path d="M 310 200 L 430 200"/>
  <path d="M 310 320 C 365 320, 375 220, 430 220"/>
  <path d="M 310 320 L 430 320"/>
  <path d="M 680 55 L 800 55"/>
  <path d="M 680 175 C 735 175, 745 75, 800 75"/>
  <path d="M 680 200 L 800 200"/>
</g>
<path d="M 555 355 L 555 395 L 15 395 L 15 200 L 40 200" fill="none" stroke="#8e44ad" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#update-arrow)"/>
<g font-family="Source Sans Pro, Arial, sans-serif" text-anchor="middle" fill="#1f2933">
<g id="params">
  <rect x="40" y="55" width="270" height="70" fill="#eef3fb" stroke="#276dc3" stroke-width="1.5"/>
  <path d="M 40 55 h 270 v 26 h -270 z" fill="#dce8f8" stroke="#276dc3" stroke-width="1.5"/>
  <text x="175.0" y="73" font-size="17" font-weight="600">Inputs</text>
  <text x="175.0" y="110" font-size="23">input$a, input$b</text>
</g>
<g id="x">
  <rect x="40" y="165" width="270" height="70" fill="#eef3fb" stroke="#276dc3" stroke-width="1.5"/>
  <path d="M 40 165 h 270 v 26 h -270 z" fill="#dce8f8" stroke="#276dc3" stroke-width="1.5"/>
  <text x="175.0" y="183" font-size="17" font-weight="600">Input</text>
  <text x="175.0" y="220" font-size="23">input$x</text>
</g>
<g id="n">
  <rect x="40" y="285" width="270" height="70" fill="#eef3fb" stroke="#276dc3" stroke-width="1.5"/>
  <path d="M 40 285 h 270 v 26 h -270 z" fill="#dce8f8" stroke="#276dc3" stroke-width="1.5"/>
  <text x="175.0" y="303" font-size="17" font-weight="600">Input</text>
  <text x="175.0" y="340" font-size="23">input$n</text>
</g>
<g id="appearance">
  <rect x="430" y="20" width="250" height="70" fill="#eef3fb" stroke="#276dc3" stroke-width="1.5"/>
  <path d="M 430 20 h 250 v 26 h -250 z" fill="#dce8f8" stroke="#276dc3" stroke-width="1.5"/>
  <text x="555.0" y="38" font-size="17" font-weight="600">Inputs</text>
  <text x="555.0" y="75" font-size="23">input$bw, input$facet</text>
</g>
<g id="d">
  <rect x="430" y="155" width="250" height="70" fill="#fff8e8" stroke="#b87800" stroke-width="1.5"/>
  <path d="M 430 155 h 250 v 26 h -250 z" fill="#ffebbd" stroke="#b87800" stroke-width="1.5"/>
  <text x="555.0" y="173" font-size="17" font-weight="600">Reactive</text>
  <text x="555.0" y="210" font-size="23">d()</text>
</g>
<g id="obs">
  <rect x="430" y="285" width="250" height="70" fill="#f8f1fb" stroke="#8e44ad" stroke-width="1.5"/>
  <path d="M 430 285 h 250 v 26 h -250 z" fill="#eadcf2" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="555.0" y="303" font-size="17" font-weight="600">Observer</text>
  <text x="555.0" y="340" font-size="23">Updates the x slider</text>
</g>
<g id="plot">
  <rect x="800" y="20" width="250" height="70" fill="#edf7f2" stroke="#006b4f" stroke-width="1.5"/>
  <path d="M 800 20 h 250 v 26 h -250 z" fill="#d5ebdf" stroke="#006b4f" stroke-width="1.5"/>
  <text x="925.0" y="38" font-size="17" font-weight="600">Output</text>
  <text x="925.0" y="75" font-size="23">output$plot</text>
</g>
<g id="table">
  <rect x="800" y="155" width="250" height="70" fill="#edf7f2" stroke="#006b4f" stroke-width="1.5"/>
  <path d="M 800 155 h 250 v 26 h -250 z" fill="#d5ebdf" stroke="#006b4f" stroke-width="1.5"/>
  <text x="925.0" y="173" font-size="17" font-weight="600">Output</text>
  <text x="925.0" y="210" font-size="23">output$table</text>
</g>
</g>
</svg>
